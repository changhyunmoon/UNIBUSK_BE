spring:
  datasource:
    url: jdbc:mysql://localhost:3306/unibusk?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ansckdgus1!
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      password:
  security:
    cookie:
      domain: localhost
      http-only: true
      secure: false
      same-site: Lax
    o-auth-url:
      login-url: /oauth2/authorization/kakao
      redirect-url: http://localhost:3000/oauth/callback
    oauth2:
      client:
        registration:
          kakao:
            client-id: local-kakao-client-id
            client-secret: local-kakao-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://127.0.0.1:3000
    - http://127.0.0.1:5173

kakao:
  api:
    url: https://dapi.kakao.com
    key: local-kakao-rest-api-key

