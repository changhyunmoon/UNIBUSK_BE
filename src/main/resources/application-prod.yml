spring:
  datasource:
    url: jdbc:mysql://CHANGE_ME_DB_HOST:3306/CHANGE_ME_DB_NAME?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: CHANGE_ME_DB_USERNAME
    password: CHANGE_ME_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  data:
    redis:
      host: CHANGE_ME_REDIS_HOST
      port: 6379
      password:
  security:
    cookie:
      domain: unibusk.site
      http-only: true
      secure: true
      same-site: None
    o-auth-url:
      login-url: /oauth2/authorization/kakao
      redirect-url: https://unibusk.site/oauth/callback
    oauth2:
      client:
        registration:
          kakao:
            client-id: CHANGE_ME_KAKAO_CLIENT_ID
            client-secret: CHANGE_ME_KAKAO_CLIENT_SECRET
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

cors:
  allowed-origins:
    - https://unibusk.site
    - https://www.unibusk.site
    - https://dev.unibusk.site

kakao:
  api:
    url: https://dapi.kakao.com
    key: CHANGE_ME_KAKAO_REST_API_KEY

cloud:
  aws:
    region:
      static: ap-northeast-2
    credentials:
      access-key:
      secret-key:
    s3:
      bucket: CHANGE_ME_S3_BUCKET
      public-url: https://%s.s3.amazonaws.com

app:
  public-base-url: https://unibusk.site/api

image-upload:
  storage-mode: s3

jwt:
  secret-key: cHJvZC1jaGFuZ2UtbWUtand0LXNlY3JldC1rZXktMzJieXRlcyEh
